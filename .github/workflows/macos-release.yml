name: Build macOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Build macOS installer
        run: npm run tauri:build:mac -- --no-sign

      - name: Copy release asset
        run: |
          set -e
          DMG_PATH=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | head -n 1)
          if [ -z "$DMG_PATH" ]; then
            echo "No macOS DMG was produced."
            exit 1
          fi
          cp "$DMG_PATH" "src-tauri/target/release/bundle/dmg/quality-life-macos.dmg"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: quality-life-macos-installer
          path: src-tauri/target/release/bundle/dmg/quality-life-macos.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/dmg/quality-life-macos.dmg
